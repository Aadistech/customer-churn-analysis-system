<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Processing | Aadibi.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include 'header.html' %}

    <div class="main-workspace">
        <h2 style="margin-top: 0; color: #0f172a;">Batch Churn Prediction Module</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 14px;">Upload customer datasets in bulk to process automated risk scoring and recommendations.</p>

        <div class="card" style="max-width: 600px; text-align: center; padding: 40px 30px;">
            <h3 style="margin: 0 0 10px 0; color: #0f172a;">Upload Customer CSV Dataset</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Select your raw telemetry file to generate bulk risk signals.</p>
            
            <input type="file" style="margin-bottom: 20px; padding: 10px; border: 1px dashed #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; background: #f8fafc;">
            <button onclick="alert('Bulk processing pipeline active! Output saved to output/bulk_prediction_results.csv')" style="width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer;">Process Bulk Dataset</button>
        </div>
    </div>

</body>
</html>
